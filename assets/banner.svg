<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Banner reading: S. Aminathu Saliha, B.E. CSE Student, Web Developer, Building practical projects, Mohamed Sathak Engineering College Kilakarai, Class of 2027, CGPA 9.6 out of 10">
  <title>S. Aminathu Saliha — profile banner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#0d1326"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b61ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d9f4ff"/>
      <stop offset="1" stop-color="#7ee0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7b61ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141d33" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1000" height="280" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)" opacity="0.45"/>
    <ellipse cx="880" cy="20" rx="300" ry="180" fill="url(#cyanGlow)"/>
    <ellipse cx="110" cy="270" rx="320" ry="190" fill="url(#violetGlow)"/>
    <circle cx="872" cy="66" r="86" fill="none" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="872" cy="66" r="112" fill="none" stroke="#7b61ff" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 10"/>
    <circle cx="933" cy="5" r="4.5" fill="#00e5ff" opacity="0.9"/>
    <circle cx="791" cy="137" r="3.5" fill="#7b61ff" opacity="0.9"/>

    <text x="500" y="126" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="3" fill="url(#nameGrad)">S. AMINATHU SALIHA</text>
    <rect x="410" y="150" width="180" height="3.5" rx="2" fill="url(#accent)"/>
    <text x="500" y="196" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#a9bdd6">B.E. CSE Student &#183; Web Developer &#183; Building practical projects</text>
    <text x="500" y="234" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#7488a6">Mohamed Sathak Engineering College, Kilakarai &#183; Class of 2027 &#183; CGPA 9.6 / 10</text>
